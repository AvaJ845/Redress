name: Redress
options:
  bundleIdPrefix: AvaResearchLLC
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: en
    SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  Redress:
    build:
      targets:
        Redress: all
        RedressTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Redress.storekit
    test:
      targets:
        - RedressTests
targets:
  Redress:
    type: application
    platform: iOS
    sources:
      - path: Redress
    info:
      path: Redress/App/Info.plist
      properties:
        CFBundleDisplayName: Redress
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_NAME: Redress
        PRODUCT_BUNDLE_IDENTIFIER: AvaResearchLLC.Redress
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
  RedressTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RedressTests
    dependencies:
      - target: Redress
    settings:
      base:
        PRODUCT_NAME: RedressTests
        PRODUCT_BUNDLE_IDENTIFIER: AvaResearchLLC.Redress.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Redress.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Redress"
        BUNDLE_LOADER: "$(TEST_HOST)"
