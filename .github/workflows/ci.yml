name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-tests:
    name: App · xcodebuild test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select an available iOS simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available \
            | grep -oE 'iPhone [0-9][^(]*' | head -1 | xargs)
          if [ -z "$DEVICE" ]; then echo "No iPhone simulator available"; exit 1; fi
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE"
      - name: xcodebuild test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Redress.xcodeproj \
            -scheme Redress \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO

  ingest-tests:
    name: Ingest engine · python unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run ingest engine test suite
        run: python3 -m unittest Tools.ingest.tests.test_engine Tools.ingest.tests.test_state_ag_rss Tools.ingest.tests.test_freshness -v
